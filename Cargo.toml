[package]
name = "transactions"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
csv-async = { version = "1.3.1", features = ["tokio"] }
futures = "0.3.32"
rocksdb = "0.24.0"
rust_decimal = { version = "1.41.0", features = ["serde-with-str"] }
serde = { version = "1.0.228", features = ["derive"] }
sled = "0.34.7"
tokio = { version = "1.52.2", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread"] }
tokio-stream = "0.1.18"

[dev-dependencies]
rust_decimal_macros = "1.40.0"
serde_json = "1.0.149"
tempfile = "3.27.0"
